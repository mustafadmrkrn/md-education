function ogrAdDegis(eski,yeni){
Object.keys(db.yoklama).forEach(k=>{const [d,h,a]=k.split('|');if(a==eski){db.yoklama[`${d}|${h}|${yeni}`]=db.yoklama[k];delete db.yoklama[k]}});
Object.keys(db.yokNot).forEach(k=>{const [d,h,a]=k.split('|');if(a==eski){db.yokNot[`${d}|${h}|${yeni}`]=db.yokNot[k];delete db.yokNot[k]}});
db.odevler.forEach(x=>{if(eski in x.teslim){x.teslim[yeni]=x.teslim[eski];delete x.teslim[eski]}if(x.hedef)x.hedef=x.hedef.map(a=>a==eski?yeni:a)});
db.odemeler.forEach(p=>{if(p.ogr==eski)p.ogr=yeni});
if(db.riza[eski]){db.riza[yeni]=db.riza[eski];delete db.riza[eski]}
if(kisi.ogrenci==eski)kisi.ogrenci=yeni}
function ogrKaydet(f,x){
const fd=new FormData(f),eski=x.eski,dersler=fd.getAll('dersler');
if(bulut&&eski&&x.ad!==eski){toast('Giriş hesabı ada bağlı olduğu için ad değiştirilemez');return false}
if(!x.ad||!dersler.length){toast(x.ad?'En az bir ders seçin':'Ad soyad yazın');return false}
if(x.ad!==eski&&ob(x.ad)){toast('Bu adla bir öğrenci zaten var');return false}
const o=eski?ob(eski):{aktif:true};
['dogum','sehir','eposta','telefon','duzey','sinif','okul','veli','seviye','cihaz','hedef','not'].forEach(a=>o[a]=x[a]);
Object.assign(o,{dersler,gunler:fd.getAll('gunler'),kurum:kurumDegeri(x,o.kurum,!eski)});
if(eski&&eski!=x.ad)ogrAdDegis(eski,x.ad);
o.ad=x.ad;if(!eski)db.ogrenciler.push(o);kg.ogr.form=null;kg.ogr.ac=x.ad;return true}
function veliKaydet(f,x){
const fd=new FormData(f),eski=x.eski;
if(bulut&&eski&&x.ad!==eski){toast('Giriş hesabı ada bağlı olduğu için ad değiştirilemez');return false}
if(!x.ad){toast('Ad soyad yazın');return false}
if(x.ad!==eski&&db.veliler.includes(x.ad)){toast('Bu adla bir veli zaten var');return false}
const k={...(eski?vk(eski):{aktif:true}),iletisim:fd.getAll('iletisim'),saat:fd.getAll('saat'),ticari:!!x.ticari};
['yakinlik','sehir','eposta','telefon','telefon2','plan','not'].forEach(a=>k[a]=x[a]);k.kurum=kurumDegeri(x,k.kurum,!eski);
if(eski){db.veliler[db.veliler.indexOf(eski)]=x.ad;db.ogrenciler.forEach(o=>{if(o.veli==eski)o.veli=x.ad});if(kisi.veli==eski)kisi.veli=x.ad;delete veliKayit[eski]}else db.veliler.push(x.ad);
veliKayit[x.ad]=k;
const secili=fd.getAll('cocuklar');db.ogrenciler.forEach(o=>{if(secili.includes(o.ad))o.veli=x.ad;else if(o.veli==x.ad)o.veli='—'});
kg.veli.form=null;kg.veli.ac=x.ad;return true}

if(a=='kyeni')g.form='yeni';

if(a=='kduzen')g.form=v;

const engel=t=='ogr'?(v==kisi.ogrenci||Object.keys(db.yoklama).some(k=>k.endsWith('|'+v))||db.odemeler.some(p=>p.ogr==v)?'Yoklama veya ödeme kaydı olan öğrenci silinemez. Pasife alabilirsiniz.':''):(v==kisi.veli||db.ogrenciler.some(o=>o.veli==v)?'Öğrencisi olan veli silinemez. Pasife alabilirsiniz.':'');
if(engel)toast(engel);else if(g.sil!=v)g.sil=v;else{if(t=='ogr'){db.ogrenciler.splice(db.ogrenciler.findIndex(o=>o.ad==v),1);delete db.riza[v];db.odevler.forEach(x=>delete x.teslim[v])}else{db.veliler.splice(db.veliler.indexOf(v),1);delete veliKayit[v]}g.sil=null;toast('Kayıt silindi')}}
if(a!='ksil')g.sil=null}

function kVeli(v){return kurumSuz([vk(v).kurum,...db.ogrenciler.filter(o=>o.veli==v).flatMap(kOgr)])}

<div class="dersnotu"><label><b>Dersin genel açıklaması</b> (${sec.h}. hafta, öğrenci ve veli görür)<textarea rows="3" data-dersnot="${d.id}|${sec.h}" placeholder="Bu derste neler işlendi, bir sonraki derse hazırlık...">${E(db.dersNot[`${d.id}|${sec.h}`]||'')}</textarea></label><button class="btn" data-a="ykaydet">${I('save',16)} Açıklamaları kaydet</button></div>`)}

const odDurum=(x,ad)=>{const t=x.teslim[ad];if(t)return t.sonuc=='eksik'?['Eksik, yeniden gönderilmeli','bad']:t.sonuc=='tamam'?['Değerlendirildi','ok']:t.gec?['Geç teslim edildi','dikkat']:['Teslim edildi','bilgi'];return gunFark(x.son)<0?['Süresi geçti','bad']:['Bekliyor','dikkat']};

const odBilgi=(x,veli)=>`<div class="odic">${x.aciklama?`<div><small>Yönerge</small><p>${E(x.aciklama)}</p></div>`:''}${x.kazanim?`<div><small>Bu ödevin kazandırdığı</small><p>${E(x.kazanim)}</p></div>`:''}${x.bicim&&x.bicim.length?`<div><small>Teslim biçimi</small><p>${x.bicim.map(E).join(', ')}</p></div>`:''}${x.link||x.dosya?`<div><small>Kaynaklar</small><p>${ek(x.link,x.dosya)}</p></div>`:''}${veli&&x.veliNot?`<div class="velinot"><small>${I('message-circle',13)} Veliye not</small><p>${E(x.veliNot)}</p></div>`:''}</div>`;
const odTeslim=(x,t)=>t?`<div class="teslimkutu"><small>Gönderilen çalışma · ${tarih(t.tarih)}</small>${t.metin?`<p>${E(t.metin)}</p>`:''}<div>${ek(t.link,t.dosya)}</div>${t.sonuc||t.puan||t.yorum?`<div class="geribildirim"><b>${I('graduation-cap',15)} Öğretmen değerlendirmesi</b>${t.puan!==''&&t.puan!=null?`<span class="notu">${E(t.puan)} / ${E(x.puan||100)}</span>`:''}<p>${E(t.yorum||'Yorum yazılmadı')}</p></div>`:'<div class="mut">Henüz değerlendirilmedi</div>'}</div>`:'';
const uzunAlan=(ad,l,ph,zorunlu=false,v='')=>`<label class="tum">${l}${zorunlu?' <em>*</em>':''}<textarea name="${ad}" rows="3" placeholder="${ph}" ${zorunlu?'required':''}>${E(v)}</textarea></label>`;

${bolumKutu(4,'users','Kime ve veli notu','Hiç öğrenci seçmezseniz tüm sınıfa verilir',(ogr.length?kutular_('hedef','Yalnızca seçilen öğrenciler',ogr.map(o=>o.ad)):'<p class="mut">Bu derste henüz öğrenci yok.</p>')+uzunAlan('veliNot','Veliye not','Evde nasıl destek olunabilir?'))}
<div class="eylem sol"><button class="btn">${I('send',16)} Ödevi yayınla</button><button type="button" class="btn s" data-a="oform">Vazgeç</button></div></form>`}

function odevHoca(d,ogr){
const l=db.odevler.filter(x=>x.ders==d.id).slice().reverse();
const hepsi=l.flatMap(x=>ogr.filter(o=>hedefte(x,o.ad)).map(o=>[x,x.teslim[o.ad]]));
const gelen=hepsi.filter(([,t])=>t).length,bekleyen=hepsi.filter(([,t])=>t&&!t.sonuc).length;
return kutular([['clock','Süresi dolan ödev',l.filter(x=>gunFark(x.son)<0).length,'#db2777'],['inbox','Gelen teslim',`${gelen}/${hepsi.length}`,'#4f46e5'],['file-pen-line','Değerlendirme bekleyen',bekleyen,'#ea580c']])+
(od.form?blok('circle-plus','Yeni ödev',odevForm(d,ogr)):`<div class="eylem sol" style="margin-bottom:14px"><button class="btn" data-a="oform">${I('circle-plus',16)} Yeni ödev ver</button></div>`)+
blok('notebook-pen','Verilen ödevler',l.length?`<div class="odliste">${l.map(x=>{const h=ogr.filter(o=>hedefte(x,o.ad)),n=h.filter(o=>x.teslim[o.ad]).length,g=h.filter(o=>x.teslim[o.ad]?.sonuc).length,acik=od.ac==x.id;
return `<article class="odkart">${odBas(x,`<span class="tag">${x.hedef?`${h.length} öğrenciye`:'Tüm sınıf'}</span>`)}<div class="bar"><i style="width:${100*n/(h.length||1)}%"></i></div><small>${n}/${h.length} teslim · ${g} değerlendirildi</small>
<div class="eylem sol"><button class="btn s" data-a="oac" data-v="${x.id}">${I('users',14)} ${acik?'Teslimleri gizle':'Teslimleri gör ve değerlendir'}</button>${od.sil==x.id?`<button class="btn s tehlike" data-a="osil" data-v="${x.id}">Evet, ödevi sil</button><button class="btn s" data-a="ovazgec">Vazgeç</button>`:`<button class="btn s" data-a="osil" data-v="${x.id}">${I('trash-2',14)} Sil</button>`}</div>
${acik?odBilgi(x,true)+h.map(o=>{const t=x.teslim[o.ad];return `<div class="teslimsatir"><div class="satirbas">${kim(o.ad,E(o.sinif))}${rozet_(odDurum(x,o.ad))}</div>${t?odTeslim(x,t)+`<form class="degerlendir" data-f="degerlendir"><input type="hidden" name="id" value="${x.id}"><input type="hidden" name="ad" value="${E(o.ad)}"><label>Puan<input type="number" name="puan" min="0" max="${E(x.puan||100)}" value="${E(t.puan??'')}"></label><label>Sonuç<select name="sonuc"><option value="tamam" ${t.sonuc!='eksik'?'selected':''}>Tamam</option><option value="eksik" ${t.sonuc=='eksik'?'selected':''}>Eksik, tekrar gönder</option></select></label><label class="genis">Öğretmen yorumu<input name="yorum" value="${E(t.yorum||'')}" placeholder="Öğrenci ve veli görür"></label><button class="btn s">Kaydet</button></form>`:''}</div>`}).join(''):''}</article>`}).join('')}</div>`:bos('Henüz ödev vermediniz.'))}

function odevOgr(d,o,veli){
const tum=odevleri(d.id,o.ad).slice().sort((a,b)=>b.son.localeCompare(a.son));
const t=x=>x.teslim[o.ad];
const suz={'Tümü':()=>true,'Bekleyen':x=>!t(x)||t(x).sonuc=='eksik','Teslim edilen':x=>t(x)&&!t(x).sonuc,'Değerlendirilen':x=>t(x)?.sonuc=='tamam'};
const puanli=tum.filter(x=>t(x)&&t(x).puan!==''&&t(x).puan!=null);
const ort=puanli.length?Math.round(puanli.reduce((a,x)=>a+100*t(x).puan/(x.puan||100),0)/puanli.length):'—';
const l=tum.filter(suz[od.filtre]);
return kutular([['notebook-pen','Toplam ödev',tum.length,'#4f46e5'],['clock','Bekleyen',tum.filter(suz['Bekleyen']).length,'#ea580c'],['circle-check-big','Teslim edilen',tum.filter(t).length,'#059669'],['award','Ortalama (100 üzerinden)',ort,'#db2777']])+
blok('notebook-pen',veli?'Ödev takibi':'Ödevlerim',`<div class="chips odf">${Object.keys(suz).map(k=>`<button data-a="ofiltre" data-v="${k}" class="${od.filtre==k?'on':''}">${k} (${tum.filter(suz[k]).length})</button>`).join('')}</div>${l.length?`<div class="odliste">${l.map(x=>{const s=t(x),acik=od.teslim==x.id,gonder=!veli&&(!s||s.sonuc!='tamam');

if(KISITABLO[t])await istek('/functions/v1/hesap',{method:'POST',body:{islem:'sil',rol:KISITABLO[t],ad:JSON.parse(k)[0]}}).catch(()=>toast('Giriş hesabı kaldırılamadı'))}}
for(const t of TABLO){if(!y[t])continue;
for(const [k,j] of simdiki.get(t)){const eski=iz.get(t).get(k);if(eski===j)continue;const r=JSON.parse(j);
let tamam=false;
if(eski!==undefined&&y[t].includes('g')){const s=await istek(`/rest/v1/${t}?${filtre(t,JSON.parse(k))}`,{method:'PATCH',body:r,prefer:'return=representation'});tamam=s.length>0}
if(!tamam){if(!y[t].includes('e'))throw new Error('Bu değişiklik için yetkiniz yok');await istek(`/rest/v1/${t}`,{method:'POST',body:r,prefer:eski===undefined&&t=='dersler'?'return=minimal':'resolution=merge-duplicates,return=minimal'})}
iz.get(t).set(k,j)}}
durumYaz('Kaydedildi')}
catch(e){durumYaz('Kaydedilemedi');toast('Kaydedilemedi: '+e.message);calisiyor=false;await tazele(true);return}
calisiyor=false;if(surum!==kirli)planla(100)}
function planla(ms=600){if(!bulut)return;clearTimeout(zaman);zaman=setTimeout(esitle,ms)}
function degisti(ms){if(!bulut)return;const s=goruntu();if(TABLO.some(t=>YETKI[rol]?.[t]&&(s.get(t).size!==iz.get(t).size||[...s.get(t)].some(([k,j])=>iz.get(t).get(k)!==j)))){kirli++;durumYaz('Kaydediliyor…');planla(ms)}}
async function tazele(zorla){const s=kirli;try{const uygula=await veriYukle();if(!zorla&&(s!==kirli||zaman||calisiyor))return;uygula();kisiAyarla();const y=scrollY;ciz();scrollTo(0,y)}catch(e){toast('Veriler alınamadı: '+e.message)}}
function durumYaz(m){let d=$('#kayitdurum');if(!d){d=document.createElement('div');d.id='kayitdurum';d.setAttribute('role','status');document.body.appendChild(d)}d.textContent=m;d.hidden=false;clearTimeout(durumYaz.t);if(m=='Kaydedildi')durumYaz.t=setTimeout(()=>d.hidden=true,1800)}

function kisiAyarla(){if(rol=='veli'){const c=db.ogrenciler.map(o=>o.ad);if(!c.includes(kisi.ogrenci))kisi.ogrenci=c[0]||''}}
async function hesapListesi(){if(bulut&&(rol=='admin'||rol=='kurum'))hesaplar=temiz(await tumu('profiles?select=rol,ad,eposta&order=rol,ad'))}
async function oturumAc(){
const p=(await istek(`/rest/v1/profiles?select=rol,ad&user_id=eq.${oturum.uid}`))[0];
if(!p||!roller[p.rol])throw new Error('Hesabınıza henüz rol tanımlanmamış');
rol=p.rol;kisi[rol]=temizM(p.ad);if(rol=='ogrenci'||rol=='veli')kisi.ogrenci=rol=='ogrenci'?kisi.ogrenci:'';
(await veriYukle())();
const kayitli={ogretmen:()=>db.hocalar.includes(kisi.ogretmen)&&hk_(kisi.ogretmen).aktif,veli:()=>db.veliler.includes(kisi.veli)&&vk(kisi.veli).aktif,ogrenci:()=>ob(kisi.ogrenci)?.aktif}[rol];
if(kayitli&&!kayitli()){rol=null;throw new Error('Hesabınız pasif veya kaydınız bulunamadı')}
bulut=true;tab=0;sec={d:db.dersler[0]?.id||'',h:1};kisiAyarla();await hesapListesi()}
function cikisYap(){const t=oturum?.at;if(t)istek('/auth/v1/logout?scope=local',{method:'POST',token:t}).catch(()=>{});oturum=null;sakla();bulut=false;history.replaceState(null,'','#ana');location.reload()}

function hesapBlok(){if(!bulut)return '';
const var_=(r,a)=>hesaplar.some(h=>h.rol==r&&h.ad==a);
const grup=[['ogretmen','Öğretmen',db.hocalar],['veli','Veli',db.veliler],['ogrenci','Öğrenci',db.ogrenciler.map(o=>o.ad)]];if(rol=='admin')grup.push(['kurum','Kurum',db.kurumlar.map(k=>k.ad)]);
const sec_=grup.map(([r,b,l])=>{const k=l.filter(a=>!var_(r,a));return k.length?`<optgroup label="${b}">${k.map(a=>`<option value="${E(r+'|'+a)}">${E(a)} (${b.toLocaleLowerCase('tr')})</option>`).join('')}</optgroup>`:''}).join('');
return blok('lock','Giriş hesapları',(sec_?`<form class="card" data-f="hesap"><div><label>Kişi<select name="kisi" required><option value="">Seçin</option>${sec_}</select></label></div>${alan('eposta','E-posta','email','autocomplete="off"')}${alan('sifre','Geçici şifre (en az 8 karakter)','password','minlength="8" autocomplete="new-password"')}<div><button class="btn">Hesap aç</button></div></form>`:'<p class="mut">Hesabı olmayan kayıtlı kişi yok. Önce kişiyi ekleyin.</p>')+tablo(['Ad','Rol','E-posta',''],hesaplar.map(h=>[E(h.ad),roller[h.rol]||'',E(h.eposta||''),h.rol=='admin'||(rol=='kurum'&&h.rol=='kurum')?'':`<button class="btn s" data-a="hesapsil" data-v="${E(h.rol+'|'+h.ad)}">Hesabı kaldır</button>`])))}
function sifreSayfa(){return `<h1>Şifremi değiştir</h1><form class="card" data-f="sifre">${alan('yeni','Yeni şifre (en az 8 karakter)','password','minlength="8" autocomplete="new-password"')}${alan('tekrar','Yeni şifre (tekrar)','password','minlength="8" autocomplete="new-password"')}<div><button class="btn">Şifreyi değiştir</button></div></form>`}

/* Olaylar: bulut işlemleri uygulamanın kendi dinleyicilerinden önce yakalanır */
document.addEventListener('submit',async e=>{
const f=e.target,t=f.dataset.f;
if(bulut&&!['oturum','hesap','sifre'].includes(t))f.querySelectorAll('input:not([type]),input[type=text],textarea').forEach(i=>{i.value=temizM(i.value);if(i.name=='ad')i.value=i.value.replace(/\|/g,'/')});
if(!['oturum','hesap','sifre'].includes(t)&&!(t=='kayit'&&bulutVar&&!demo))return;
e.preventDefault();e.stopImmediatePropagation();const x=Object.fromEntries(new FormData(f)),btn=f.querySelector('button');if(btn.disabled)return;btn.disabled=true;
try{
if(t=='oturum'){if(!bulutVar)throw new Error('Bu önizlemede bulut bağlantısı kapalı. Yayındaki siteden giriş yapın.');
oturumKur(await istek('/auth/v1/token?grant_type=password',{method:'POST',body:{email:x.eposta.trim(),password:x.sifre},token:null}).catch(er=>{throw new Error(er.kod==400?'E-posta veya şifre hatalı':er.message)}));
try{if(demo){veriKoy(JSON.parse(ORNEK));demo=false}await oturumAc()}catch(er){oturum=null;sakla();rol=null;throw er}git('panel')}
if(t=='kayit'){await istek('/rest/v1/basvuru',{method:'POST',body:{data:temiz({tip:x.tip,ad:x.ad.trim()})},prefer:'return=minimal',token:null});f.reset();toast('Başvuru alındı')}
if(t=='hesap'){const [r,ad]=x.kisi.split('|');await istek('/functions/v1/hesap',{method:'POST',body:{islem:'ac',rol:r,ad,eposta:x.eposta.trim(),sifre:x.sifre}});await hesapListesi();ciz();toast('Hesap açıldı')}
if(t=='sifre'){if(x.yeni!==x.tekrar)throw new Error('Şifreler aynı değil');await istek('/auth/v1/user',{method:'PUT',body:{password:x.yeni}});f.reset();toast('Şifreniz değiştirildi')}
}catch(er){toast(er.message=='Failed to fetch'?'Sunucuya ulaşılamadı':er.message)}finally{btn.disabled=false}},true);
let silOnay='';
document.addEventListener('click',async e=>{
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,dur=()=>{e.preventDefault();e.stopImmediatePropagation()};
if(a=='gir'){if(bulut)return dur();if(!demo){veriKoy(JSON.parse(ORNEK));demo=true}return}
if(a=='cikis'){if(bulut){dur();if(zaman)await esitle();return cikisYap()}if(demo&&bulutVar){dur();history.replaceState(null,'','#ana');location.reload()}return}
if(a=='cocuk'){dur();kisi.ogrenci=v;sec={d:'',h:1};return ciz()}
if(a=='hesapsil'){dur();if(silOnay!=v){silOnay=v;b.textContent='Emin misiniz?';return}silOnay='';const [r,ad]=v.split('|');try{await istek('/functions/v1/hesap',{method:'POST',body:{islem:'sil',rol:r,ad}});await hesapListesi();ciz();toast('Hesap kaldırıldı')}catch(er){toast(er.message)}return}
if(a=='basvur'&&bulutVar&&!demo&&rol){dur();try{await istek('/rest/v1/basvuru',{method:'POST',body:{data:temiz({ad:kisi[rol],tip:'Ders talebi: '+D(v).ad})},prefer:'return=minimal'});toast('Talebiniz iletildi')}catch(er){toast(er.message)}}
},true);
document.addEventListener('click',e=>{if(!bulut)return;if(e.target.closest('[data-a]'))degisti(600);if(e.target.closest('.tabs [data-a=tab]')&&!zaman&&!calisiyor)tazele(false)});
document.addEventListener('submit',()=>degisti(300));
document.addEventListener('input',()=>degisti(1500));
document.addEventListener('change',()=>degisti(600));
addEventListener('beforeunload',e=>{if(bulut&&(zaman||calisiyor))e.preventDefault()});

async function baslat(){
if(!bulutVar)return ciz();
$('#app').innerHTML='<p class="mut" style="padding:40px 0;text-align:center">Yükleniyor…</p>';
try{await derslerYukle()}catch(_){veriKoy(JSON.parse(ORNEK));toast('Sunucuya ulaşılamadı; örnek veri gösteriliyor');return ciz()}
try{oturum=JSON.parse(sessionStorage.getItem('md-oturum'))}catch(_){}
if(oturum)try{await oturumAc()}catch(e){oturum=null;sakla();rol=null;toast(e.message)}
ciz()}
baslat();
</script>
