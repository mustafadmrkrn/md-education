${kazPanel(d,true)}`}
function giris(){return `<h1>Oturum aç</h1><h2>Admin girişi</h2><form class="card" data-f="giris">${alan('kullanici','Kullanıcı adı','text','autocomplete="off" autocapitalize="none"')}${alan('sifre','Şifre','password','autocomplete="off"')}<div><button class="btn">Giriş yap</button></div></form><h2>Demo panelleri</h2><p class="mut">Diğer roller prototipte şifresiz açılır.</p><div class="grid giris">${Object.keys(roller).filter(r=>r!='admin').map(r=>`<div class="card" style="--p:${TEMA[r][0]}"><span class="buyuk">${I(TEMA[r][2],28)}</span><h3>${roller[r]}</h3><p class="mut">${E(kisi[r])}</p><button class="btn" data-a="gir" data-v="${r}">${roller[r]} olarak gir</button></div>`).join('')}</div>`}
function kayit(){return `<h1>Kaydol</h1><p class="mut">Veli, öğrenci ve öğretmen başvurur; admin onaylar. Kurum hesabını admin açar. Gerçek bilgi girmeyin.</p>${form('kayit',secim('tip','Rol',['Veli','Öğrenci','Öğretmen'])+alan('ad','Ad soyad'),'Başvuru gönder')}`}

const sekme={admin:['Özet','Kurumlar','Dersler','Öğretmenler','Başvurular'],kurum:['Özet','Öğretmenler','Veliler','Öğrenciler'],ogretmen:['Kazanım ve plan','Yoklama','Ödevler','Öğrencilerim'],ogrenci:['Haftalarım','Ödevlerim'],veli:['Genel durum','Yoklama','Ödevler','Ödemeler']};
const sIkon={admin:['layout-dashboard','building-2','book-open','graduation-cap','inbox'],kurum:['layout-dashboard','graduation-cap','users','backpack'],ogretmen:['target','calendar-check','notebook-pen','users'],ogrenci:['route','notebook-pen'],veli:['layout-dashboard','calendar-check','notebook-pen','wallet']};
const TEMA={admin:['#4f46e5','#7c3aed','shield-check','Platformun tamamı tek ekranda',['chart-column','settings','building-2']],kurum:['#0f766e','#0891b2','building-2','Kurumunuzun eğitim görünümü',['users','book-open','graduation-cap']],ogretmen:['#c2410c','#db2777','presentation','Dersinizi planlayın, sınıfınızı takip edin',['notebook-pen','calendar-check','lightbulb']],ogrenci:['#1d4ed8','#7c3aed','rocket','Yolculuğunda hangi haftadasın, gör',['star','trophy','code-xml']],veli:['#047857','#1d4ed8','heart-handshake','Çocuğunuzun gelişimi bir bakışta',['chart-column','calendar-check','wallet']]};
const I=(n,b=18)=>`<svg class="ik" width="${b}" height="${b}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IKON[n]||''}</svg>`;
const RENK=['#4f46e5','#0891b2','#db2777','#ea580c','#059669','#7c3aed'];
const rk=a=>RENK[[...String(a)].reduce((t,c)=>t+c.charCodeAt(0),0)%RENK.length];
const avatar=(a,b=40)=>`<span class="av" style="width:${b}px;height:${b}px;font-size:${b*.36}px;background:${rk(a)}">${E(String(a).split(' ').map(x=>x[0]||'').join('').slice(0,2).toLocaleUpperCase('tr'))}</span>`;
const kim=(a,alt='')=>`<div class="kim">${avatar(a)}<div><b>${E(a)}</b>${alt?`<div class="mut">${alt}</div>`:''}</div></div>`;
const kutular=a=>`<div class="kpi">${a.map(([ik,n,v,c])=>`<div class="kp" style="--c:${c}"><span>${I(ik,24)}</span><div><b>${v}</b><small>${n}</small></div></div>`).join('')}</div>`;
const blok=(ik,baslik,ic)=>`<section class="blok"><h2>${I(ik,20)} ${baslik}</h2>${ic}</section>`;
const bos=m=>`<div class="bos">${I('inbox',34)}<p>${m}</p></div>`;
const halka=(y,ad,c)=>`<div class="halka"><div style="--y:${y||0};--c:${c}"><b>${y==null?'—':'%'+y}</b></div><span>${ad}</span></div>`;
const tarih=t=>{const x=new Date(t+'T12:00');return isNaN(x)?E(t):x.toLocaleDateString('tr',{day:'numeric',month:'long'})};
const tl=n=>n.toLocaleString('tr')+' TL';
const sayi=id=>db.ogrenciler.filter(o=>o.dersler.includes(id)).length;
const cubuk=l=>{const m=Math.max(1,...l.map(x=>x[1]));return `<div class="cubuk">${l.map(([a,v],i)=>`<div><span>${E(a)}</span><i><u style="width:${100*v/m}%;background:${RENK[i%6]}"></u></i><b>${v}</b></div>`).join('')}</div>`};
const pasta=l=>{const t=l.reduce((a,x)=>a+x[1],0)||1;let b=0;const g=l.map(([a,v],i)=>{const s=b;b+=100*v/t;return `${RENK[i%6]} ${s}% ${b}%`}).join(',');return `<div class="pasta"><div style="background:conic-gradient(${g})"><b>${t}<small>ders</small></b></div><ul>${l.map(([a,v],i)=>`<li><i style="background:${RENK[i%6]}"></i>${E(a)} <b>${v}</b></li>`).join('')}</ul></div>`};

function ozet(){
const kat={};db.dersler.forEach(d=>kat[d.kat]=(kat[d.kat]||0)+1);
const hizli=rol=='admin'?[['building-2','Kurum aç',1],['circle-plus','Ders ekle',2],['user-plus','Öğretmen ekle',3],['inbox',`Başvurular (${db.basvuru.length})`,4]]:[['user-plus','Öğretmen ekle',1],['users','Veli ekle',2],['backpack','Öğrenci ekle',3]];
return kutular([['backpack','Öğrenci',db.ogrenciler.length,'#4f46e5'],['graduation-cap','Öğretmen',db.hocalar.length,'#ea580c'],['book-open','Ders',db.dersler.length,'#0891b2'],['users','Veli',db.veliler.length,'#db2777'],['building-2','Kurum',db.kurumlar.length,'#059669']])
+`<div class="hizli">${hizli.map(([ik,a,t])=>`<button data-a="tab" data-v="${t}">${I(ik,22)}${a}</button>`).join('')}</div>`
+`<div class="iki">${blok('chart-column','Derslere göre öğrenci',cubuk(db.dersler.map(d=>[d.ad,sayi(d.id)])))}${blok('chart-pie','Ders kategorileri',pasta(Object.entries(kat)))}</div>`
+blok('book-open','Verilen dersler',`<div class="dkart">${db.dersler.map(d=>`<a href="#${d.id}">${img(d)}<div><b>${E(d.ad)}</b><div class="mut">${I('clock',14)} ${d.hafta} hafta · ${I('users',14)} ${sayi(d.id)} öğrenci</div>${kim(d.hoca)}</div></a>`).join('')}</div>`)}
const hocaT=()=>blok('user-plus','Yeni öğretmen',form('hoca',alan('ad','Öğretmen adı'),'Öğretmen ekle'))+blok('graduation-cap','Öğretmenler',`<div class="kisiler">${db.hocalar.map(h=>{const l=db.dersler.filter(d=>d.hoca==h);return `<div class="kisi">${avatar(h,64)}<b>${E(h)}</b><small>${l.length} ders</small><div>${l.map(d=>`<span class="tag">${E(d.ad)}</span>`).join(' ')||'<span class="mut">Ders atanmadı</span>'}</div></div>`}).join('')}</div>`);

const panel={
admin:[ozet,
()=>blok('circle-plus','Yeni kurum',form('kurum',alan('ad','Kurum adı')+alan('sehir','Şehir'),'Kurum aç'))+blok('building-2','Kurumlar',`<div class="kisiler">${db.kurumlar.map(k=>`<div class="kisi"><span class="buyuk" style="background:${rk(k.ad)}">${I('school',30)}</span><b>${E(k.ad)}</b><small>${I('map-pin',14)} ${E(k.sehir)}</small></div>`).join('')}</div>`),
()=>blok('circle-plus','Yeni ders',form('ders',alan('ad','Ders adı')+alan('kat','Kategori')+secim('hafta','Süre (hafta)',['8','12'])+secim('hoca','Öğretmen',db.hocalar)+alan('fiyat','Ücret (TL)','number','min="0"'),'Ders ekle'))+blok('book-open','Dersler',`<div class="dkart">${db.dersler.map(d=>`<article>${img(d)}<div><a href="#${d.id}"><b>${E(d.ad)}</b></a><div class="mut">${d.hafta} hafta · ${tl(d.fiyat)}</div>${kim(d.hoca)}<div class="eylem"><label class="btn o s">${I('image-up',14)} Fotoğraf yükle<input type="file" accept="image/jpeg,image/png,image/webp" data-foto="${d.id}" hidden></label><button class="btn o s kirmizi" data-a="sil" data-v="${d.id}">${I('trash-2',14)} Kaldır</button></div></div></article>`).join('')}</div>`),
hocaT,
()=>blok('inbox','Bekleyen başvurular',db.basvuru.length?`<div class="liste">${db.basvuru.map((b,i)=>`<div class="satir">${kim(b.ad,E(b.tip))}<button class="btn s" data-a="onay" data-v="${i}">${I('check',14)} Onayla</button></div>`).join('')}</div>`:bos('Bekleyen başvuru yok. Siteden gelen kayıtlar burada görünür.'))],
kurum:[ozet,hocaT,
()=>blok('user-plus','Yeni veli',form('veli',alan('ad','Veli adı'),'Veli ekle'))+blok('users','Veliler',`<div class="kisiler">${db.veliler.map(v=>`<div class="kisi">${avatar(v,64)}<b>${E(v)}</b><small>Öğrencisi</small><div>${db.ogrenciler.filter(o=>o.veli==v).map(o=>`<span class="tag">${E(o.ad)}</span>`).join(' ')||'<span class="mut">—</span>'}</div></div>`).join('')}</div>`),
()=>blok('user-plus','Yeni öğrenci',form('ogr',alan('ad','Öğrenci adı')+alan('sinif','Sınıf')+secim('veli','Veli',db.veliler)+secim('ders','Ders',db.dersler.map(d=>[d.id,d.ad])),'Öğrenci ekle'))+blok('backpack','Öğrenciler',`<div class="kisiler">${db.ogrenciler.map(o=>`<div class="kisi">${avatar(o.ad,64)}<b>${E(o.ad)}</b><small>${E(o.sinif)} · Veli: ${E(o.veli)}</small><div>${o.dersler.map(D).filter(Boolean).map(d=>`<span class="tag">${E(d.ad)}</span>`).join(' ')}</div></div>`).join('')}</div>`)]
};
const dersSec=l=>`<div class="dsec">${l.map(d=>`<button data-a="ders" data-v="${d.id}" class="${d.id==sec.d?'on':''}"><img src="${gorsel(d)}" alt=""><span><b>${E(d.ad)}</b><small>${d.hafta} hafta</small></span></button>`).join('')}</div>`;
const haftaSec=d=>`<div class="haftalar">${d.plan.map((_,i)=>`<button data-a="hafta" data-v="${i+1}" class="${i+1==sec.h?'on':i+1<SIMDI?'gecti':''}" aria-label="${i+1}. hafta">${i+1}</button>`).join('')}</div>`;
const oran=(d,o)=>{const k=Object.keys(db.yoklama).filter(x=>x.startsWith(d+'|')&&x.endsWith('|'+o));return k.length?Math.round(100*k.filter(x=>db.yoklama[x]).length/k.length):null};
const durum=v=>v===undefined?`<span class="tag">${I('minus',12)} Alınmadı</span>`:v?`<span class="tag ok">${I('check',12)} Katıldı</span>`:`<span class="tag bad">${I('x',12)} Yok</span>`;

function hocaPanel(){
const l=db.dersler.filter(d=>d.hoca==kisi.ogretmen);if(!l.length)return bos('Atanmış dersiniz yok.');
if(!l.some(d=>d.id==sec.d))sec.d=l[0].id;const d=D(sec.d);if(sec.h>d.hafta)sec.h=1;
const ogr=db.ogrenciler.filter(o=>o.dersler.includes(d.id)),odev=db.odevler.filter(x=>x.ders==d.id);
const ort=ogr.map(o=>oran(d.id,o.ad)).filter(x=>x!=null);
const ust=kutular([['book-open','Dersim',l.length,'#ea580c'],['users','Bu derste öğrenci',ogr.length,'#4f46e5'],['notebook-pen','Verilen ödev',odev.length,'#db2777'],['activity','Ortalama devam',ort.length?'%'+Math.round(ort.reduce((a,b)=>a+b)/ort.length):'—','#059669']])+dersSec(l);
if(tab==0){const p=d.plan[sec.h-1];return ust+kazPanel(d)+blok('circle-plus','Kazanım ekle',form('kaz',alan('kaz','Yeni kazanım'),'Kazanım ekle'))+blok('calendar-days','Haftalık ve günlük plan',haftaSec(d)+`<form class="card" data-f="plan" style="grid-template-columns:1fr"><label>Haftanın konusu ve içeriği<input name="konu" value="${E(p.konu)}" required></label><label>Günlük plan (gün gün yazın)<textarea name="gunluk" rows="4">${E(p.gunluk)}</textarea></label><label><input type="checkbox" name="kayit" style="width:auto" ${p.kayit?'checked':''}> Ders kaydı yüklendi</label><div><button class="btn">${I('save',16)} Planı kaydet</button></div></form>`)+blok('route','Dönem planı',`<ol class="zaman">${d.plan.map((p,i)=>`<li class="${i+1<SIMDI?'gecti':i+1==SIMDI?'simdi':''}"><i>${i+1}</i><div><b>${E(p.konu)}</b></div>${p.kayit?`<span class="tag">${I('video',12)} Kayıt var</span>`:''}</li>`).join('')}</ol>`)}
if(tab==1){const v=ogr.map(o=>db.yoklama[`${d.id}|${sec.h}|${o.ad}`]);return ust+blok('calendar-check',`${sec.h}. hafta yoklaması`,haftaSec(d)+`<p><span class="tag ok">${v.filter(x=>x===true).length} var</span> <span class="tag bad">${v.filter(x=>x===false).length} yok</span> <span class="tag">${v.filter(x=>x===undefined).length} bekliyor</span></p><div class="kisiler">${ogr.map(o=>{const k=`${d.id}|${sec.h}|${o.ad}`,x=db.yoklama[k];return `<div class="kisi ${x===true?'var':x===false?'yok':''}">${avatar(o.ad,64)}<b>${E(o.ad)}</b>${durum(x)}<div class="eylem"><button class="btn s yesil ${x===true?'':'o'}" data-a="yok" data-v="${E(k)}" data-x="1">${I('check',14)} Var</button><button class="btn s kirmizi ${x===false?'':'o'}" data-a="yok" data-v="${E(k)}" data-x="0">${I('x',14)} Yok</button></div></div>`}).join('')}</div>`)}
if(tab==2)return ust+blok('circle-plus','Yeni ödev',form('odev',alan('baslik','Ödev başlığı')+alan('son','Son teslim','date'),'Ödev ver'))+blok('notebook-pen','Verilen ödevler',odev.length?`<div class="odevler">${odev.map(x=>{const n=ogr.filter(o=>x.teslim[o.ad]).length;return `<div class="odev"><span class="buyuk">${I('file-pen-line',26)}</span><div><b>${E(x.baslik)}</b><div class="mut">${I('calendar',13)} Son teslim: ${tarih(x.son)}</div><div class="bar"><i style="width:${100*n/(ogr.length||1)}%"></i></div><small>${n}/${ogr.length} öğrenci teslim etti</small></div></div>`}).join('')}</div>`:bos('Henüz ödev vermediniz.'));
return ust+`<p class="not">${I('lock',16)} Öğretmen veli, iletişim ve ödeme bilgilerini görmez.</p>`+blok('users','Öğrencilerim',`<div class="kisiler">${ogr.map(o=>`<div class="kisi">${avatar(o.ad,64)}<b>${E(o.ad)}</b><small>${E(o.sinif)}</small>${halka(oran(d.id,o.ad),'Devam','#059669')}</div>`).join('')}</div>`)}

function ogrPanel(veli){
const o=db.ogrenciler.find(x=>x.ad=='Ada Y.');const l=o.dersler.map(D).filter(Boolean);
if(!l.length)return bos('Kayıtlı ders yok.');
if(!l.some(d=>d.id==sec.d))sec.d=l[0].id;const d=D(sec.d);
const odev=db.odevler.filter(x=>x.ders==d.id),teslim=odev.filter(x=>x.teslim[o.ad]).length,devam=oran(d.id,o.ad);
const odeme=db.odemeler.filter(p=>p.ogr==o.ad),borc=odeme.filter(p=>!p.ok).reduce((a,p)=>a+p.tutar,0),odendi=odeme.filter(p=>p.ok).reduce((a,p)=>a+p.tutar,0);
const halkalar=`<div class="halkalar">${halka(Math.round(100*SIMDI/d.hafta),`${SIMDI}. hafta / ${d.hafta}`,'#4f46e5')}${halka(devam,'Derse devam','#059669')}${halka(odev.length?Math.round(100*teslim/odev.length):null,`Ödev ${teslim}/${odev.length}`,'#ea580c')}</div>`;
const odevT=()=>blok('notebook-pen','Ödevler',odev.length?`<div class="odevler">${odev.map(x=>{const t=x.teslim[o.ad];return `<div class="odev ${t?'tamam':''}"><span class="buyuk">${I(t?'circle-check-big':'file-pen-line',26)}</span><div><b>${E(x.baslik)}</b><div class="mut">${I('calendar',13)} Son teslim: ${tarih(x.son)}</div></div>${t?'<span class="tag ok">Teslim edildi</span>':veli?'<span class="tag bad">Bekliyor</span>':`<button class="btn s" data-a="teslim" data-v="${x.id}">Teslim ettim</button>`}</div>`}).join('')}</div>`:bos('Bu derste henüz ödev yok.'));
const yokT=()=>blok('route','Hafta hafta işlenenler',`<ol class="zaman">${d.plan.map((p,i)=>{const gelmis=i<SIMDI,v=db.yoklama[`${d.id}|${i+1}|${o.ad}`];return `<li class="${i+1<SIMDI?'gecti':i+1==SIMDI?'simdi':''}"><i>${i+1}</i><div><b>${E(p.konu)}</b><div class="mut">${i+1==SIMDI?'Bu hafta':gelmis?'İşlendi':'Sırada'}</div></div>${gelmis?durum(v):I('lock',16)}${gelmis&&v===false?(p.kayit?`<button class="btn s" data-a="izle">${I('play',14)} Kaydı izle</button>`:'<span class="mut">Kayıt henüz yüklenmedi</span>'):''}</li>`}).join('')}</ol>`);
if(!veli)return dersSec(l)+(tab==0?halkalar+yokT():odevT());
if(tab==3)return kutular([['circle-check-big','Ödenen',tl(odendi),'#059669'],['clock','Bekleyen',tl(borc),'#ea580c'],['receipt','Kayıt sayısı',odeme.length,'#4f46e5']])+blok('wallet','Ödeme geçmişi',`<div class="liste">${odeme.map(p=>`<div class="satir"><div class="kim"><span class="buyuk">${I('receipt',22)}</span><div><b>${E(p.ne)}</b><div class="mut">${tl(p.tutar)}</div></div></div>${p.ok?'<span class="tag ok">Ödendi</span>':'<span class="tag bad">Bekliyor</span>'}</div>`).join('')}</div>`);
if(tab==1)return dersSec(l)+halkalar+yokT();if(tab==2)return dersSec(l)+odevT();
return `<div class="profil">${avatar(o.ad,72)}<div><b>${E(o.ad)}</b><div class="mut">${E(o.sinif)} · ${l.length} derse kayıtlı</div></div></div>`+dersSec(l)+halkalar+kutular([['user-round','Öğretmen',E(d.hoca),'#4f46e5'],['notebook-pen','Bekleyen ödev',odev.length-teslim,'#db2777'],['wallet','Bekleyen ödeme',tl(borc),'#ea580c']])+kazPanel(d)}

function panelim(){
if(!rol)return giris();
const ic=rol=='ogretmen'?hocaPanel():rol=='ogrenci'?ogrPanel(false):rol=='veli'?ogrPanel(true):panel[rol][tab]();
const [c1,c2,ikon,slogan,suslar]=TEMA[rol];
return `<div class="pano" style="--p:${c1};--p2:${c2}"><aside><div class="ben"><span class="rozet">${I(ikon,30)}</span><b>${E(kisi[rol])}</b><small>${roller[rol]} paneli</small></div><nav class="tabs">${sekme[rol].map((s,i)=>`<button data-a="tab" data-v="${i}" class="${i==tab?'on':''}">${I(sIkon[rol][i],20)}<span>${s}</span></button>`).join('')}</nav></aside>
<div class="icerik"><div class="karsila"><div><small>${roller[rol]} paneli</small><h1>${sekme[rol][tab]}</h1><p>${slogan}${rol=='veli'?' · Öğrenciniz: Ada Y.':''}</p></div><div class="sus" aria-hidden="true">${suslar.map(s=>`<span>${I(s,34)}</span>`).join('')}</div></div>${ic}</div></div>`}
function ciz(){const h=location.hash.slice(1);header();$('#app').innerHTML=h=='giris'?giris():h=='kayit'?kayit():h=='panel'?panelim():D(h)?detay(D(h)):ana()}
function git(h){if(location.hash=='#'+h)ciz();else location.hash=h}
document.addEventListener('click',e=>{
const b=e.target.closest('[data-a]');if(!b)return;const v=b.dataset.v,a=b.dataset.a;
if(a=='gir'){rol=v;tab=0;sec={d:v=='ogretmen'?'d1':'d3',h:SIMDI};return git('panel')}
if(a=='cikis'){rol=null;return git('ana')}
if(a=='git'){e.preventDefault();ara='';kat='Tümü';$('#ara').value='';git('ana');return setTimeout(()=>$('#dersler').scrollIntoView({behavior:'smooth'}),60)}
if(a=='onizle')return toast('Tanıtım videosu eklendiğinde burada oynatılacak');
if(a=='kategori'){e.preventDefault();kat=v;ara='';git('ana');return setTimeout(()=>$('#dersler').scrollIntoView(),60)}
if(a=='kaydir')return slayt(+v);
if(a=='kat'){kat=v;const y=scrollY;ciz();return scrollTo(0,y)}
if(a=='tab')tab=+v;
if(a=='ders')sec.d=v;
if(a=='hafta')sec.h=+v;
if(a=='yok'){db.yoklama[v]=b.dataset.x=='1';toast('Yoklama kaydedildi')}
if(a=='teslim'){db.odevler.find(x=>x.id==v).teslim[kisi.ogrenci]=true;toast('Ödev teslim edildi')}
if(a=='izle')return toast('Gerçek sistemde ders videosu burada açılır');
if(a=='sil'){db.dersler=db.dersler.filter(d=>d.id!=v);toast('Ders kaldırıldı')}
if(a=='onay'){const x=db.basvuru.splice(+v,1)[0];if(x.tip=='Veli')db.veliler.push(x.ad);if(x.tip=='Öğretmen')db.hocalar.push(x.ad);if(x.tip=='Öğrenci')db.ogrenciler.push({ad:x.ad,sinif:'—',veli:'—',dersler:[]});toast('Onaylandı')}
if(a=='basvur'){if(!rol){toast('Başvuru için önce kaydolun');return git('kayit')}db.basvuru.push({ad:kisi[rol],tip:'Ders talebi: '+D(v).ad});return toast('Talebiniz admine iletildi')}
ciz()});
document.addEventListener('submit',e=>{
e.preventDefault();const f=e.target,x=Object.fromEntries(new FormData(f)),t=f.dataset.f;
for(const k in x)x[k]=x[k].trim();
if(t=='giris'){if(x.kullanici!=='admin'||x.sifre!=='admin')return toast('Kullanıcı adı veya şifre hatalı');rol='admin';tab=0;return git('panel')}
if(t=='kayit'){db.basvuru.push(x);f.reset();return toast('Başvuru alındı. Admin panelinde görünür.')}
if(t=='kurum')db.kurumlar.push(x);
if(t=='hoca')db.hocalar.push(x.ad);
if(t=='veli')db.veliler.push(x.ad);
if(t=='ogr')db.ogrenciler.push({ad:x.ad,sinif:x.sinif,veli:x.veli,dersler:[x.ders]});
if(t=='ders')db.dersler.push(ders(x.ad,x.kat,+x.hafta,x.hoca,+x.fiyat,[],[]));
if(t=='kaz')D(sec.d).kaz.push(x.kaz);
if(t=='plan')Object.assign(D(sec.d).plan[sec.h-1],{konu:x.konu,gunluk:x.gunluk||'',kayit:!!x.kayit});
if(t=='odev')db.odevler.push({id:Date.now(),ders:sec.d,...x,teslim:{}});
toast('Kaydedildi');ciz()});
function slayt(n){const k=$('#slaytlar');if(!k)return;const w=k.clientWidth,t=k.children.length,i=(Math.round(k.scrollLeft/w)+n+t)%t;k.scrollTo({left:i*w,behavior:'smooth'})}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>{if(!$('.vitrin:hover,.vitrin:focus-within'))slayt(1)},5000);
document.addEventListener('input',e=>{if(e.target.id!='ara')return;ara=e.target.value;if(!$('#liste')){location.hash='ana';return setTimeout(()=>$('#dersler').scrollIntoView(),60)}$('#liste').innerHTML=liste_();$('#dersler').scrollIntoView()});
document.addEventListener('change',e=>{const id=e.target.dataset.foto,f=id&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{D(id).foto=r.result;toast('Fotoğraf eklendi');ciz()};r.readAsDataURL(f)});
addEventListener('hashchange',()=>{ciz();scrollTo(0,0)});
ciz();
</script>
